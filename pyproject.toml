[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MARIE"
version = "0.1.0"
description = "MARIE Simple Computer Backend Simulation"
authors = [
    {name = "Steven Short"}
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only"
readme = {file = "README.txt", content-type = "text/markdown"}
dependencies = []

[project.urls]
Repository = "https://github.com/SparrowDetail/MARIE"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]